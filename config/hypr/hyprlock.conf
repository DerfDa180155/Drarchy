general {
    hide_cursor = false
    immediate_reader = true
}

background {
    monitor =
    path = screenshot

    blur_passes = 3
    blure_size = 7
    brightness = 0.7
}

label {
    monitor =
    text = $TIME
    color = rgba(255, 255, 255, 1.0)
    font_size = 72
    font_family = Sans

    position = 0, 120
    halign = center
    valign = center
}

label {
    monitor =
    text = $USER
    color = rgba(220, 220, 220, 1.0)
    font_size = 20
    font_family = Sans

    position = 0, 30
    halign = center
    valign = center
}

input-field {
    monitor =

    size = 320, 60
    outline_thickness = 2

    dots_size = 0.25
    dots_spacing = 0.2
    dots_center = true

    outer_color = rgba(ffffffaa)
    inner_color = rgba(00000099)
    font_color = rgba(ffffffff)

    fade_on_empty = false
    placeholder_text = <i>Password...</i>

    rounding = 15

    position = 0, -60
    halign = center
    valign = center
}
