source = $HOME/.config/hypr/theme/colors.conf

general {
    hide_cursor = false
    immediate_render = true
}

background {
    monitor =
    path = screenshot

    blur_passes = 3
    blur_size = 7
    brightness = 0.7
}

label {
    monitor =
    text = $TIME
    color = $text
    font_size = 72
    font_family = Sans

    position = 0, 120
    halign = center
    valign = center
}

label {
    monitor =
    text = $USER
    color = $text
    font_size = 20
    font_family = Sans

    position = 0, 30
    halign = center
    valign = center
}

input-field {
    monitor =

    size = 320, 60
    outline_thickness = 2

    dots_size = 0.25
    dots_spacing = 0.2
    dots_center = true

    outer_color = $primary
    inner_color = $surface
    font_color = $text

    check_color = $success
    fail_color = $error

    fade_on_empty = false
    placeholder_text = <i>Password...</i>

    rounding = 15

    position = 0, -60
    halign = center
    valign = center
}
